<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf6ee" />
    <script>
      try {
        const theme = localStorage.getItem("careernet_theme") === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        if (theme === "dark") document.querySelector('meta[name="theme-color"]')?.setAttribute("content", "#17131e");
      } catch {}
    </script>
    <link rel="icon" type="image/png" href="/src/assets/careernest-logo.png" />
    <title>CareerNest — Career Guidance</title>
    <meta name="description" content="Career quiz, major selection and university choice for Grade 12, GED and IGCSE students in Myanmar." />
    <!-- No web fonts are loaded: the stack in src/index.css uses system fonts,
         including Myanmar Text / Noto Sans Myanmar for Burmese. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
